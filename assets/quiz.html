<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__QUIZ_TITLE__</title>
<style>

:root{color-scheme:light;--bg:#f3f1eb;--paper:#fffefb;--text:#202f2c;--muted:#67726d;--line:#dcded5;--accent:#166651;--soft:#e8f0e9;--warn:#a1542b;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 "Microsoft YaHei","PingFang SC",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,summary,select{cursor:pointer}button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 16px;transition:background .15s,border-color .15s}button:hover{border-color:var(--accent);background:var(--soft)}button:disabled{opacity:.4;cursor:default}button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #70ab96;outline-offset:3px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#104c3d;color:white}.muted{color:var(--muted)}.small{font-size:12px}p{margin:10px 0}h1,h2{font-family:"STSong","SimSun",serif;line-height:1.4}h1{font-size:23px;margin:0}h2{margin:0 0 18px;font-size:28px}[hidden]{display:none!important}
header{max-width:1256px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:24px 30px;gap:20px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:14px;min-width:0}.mark{width:34px;height:38px;background:var(--accent);color:white;border-radius:2px 2px 12px 2px;text-align:center;font:24px/38px Georgia,serif;flex-shrink:0}.eyebrow{font:10px/1.4 Georgia,serif;letter-spacing:2px;color:var(--accent);margin-bottom:3px}#stats{font-size:12px;color:var(--muted);text-align:right;overflow-wrap:anywhere}#notice{max-width:1196px;margin:12px auto;padding:0 24px;color:var(--warn);font-size:14px}#notice:empty{display:none}
main{max-width:1256px;margin:30px auto;padding:0 30px;display:grid;grid-template-columns:248px minmax(0,1fr);gap:36px;align-items:start}main>*,aside>*,select{min-width:0}aside{position:sticky;top:20px}summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:bold;padding:12px 0;border-bottom:1px solid var(--line)}summary::-webkit-details-marker{display:none}summary::after{content:'＋';font-size:18px;color:var(--accent)}details[open]>summary::after{content:'−'}.settingsBody{padding-top:8px}label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px}select,input[type=search]{width:100%;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap}.tools{margin-top:20px}.tools button{flex:1;font-size:13px;white-space:nowrap}.backup{margin-top:18px}.backup>summary{font-size:12px;color:var(--muted)}.backup .actions{margin-top:12px}.backup button{font-size:12px;padding:7px 12px}.danger{color:var(--warn)}.legend{font-size:11px;color:var(--muted);margin-top:14px}.questionGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-height:220px;overflow-y:auto;margin:14px 0}.questionGrid button{padding:4px 0;font:12px/1.9 Georgia,serif}.questionGrid button[data-grade=passed]{background:var(--soft);color:var(--accent)}.questionGrid button[data-grade=review],.questionGrid button[data-grade=partial]{background:#faeee3;color:var(--warn)}.questionGrid button[aria-current=true]{outline:2px solid var(--accent);outline-offset:-1px;font-weight:bold}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:clip;box-shadow:0 8px 32px #263b2a05}.questionBody{padding:32px 38px 26px}.meta{display:flex;gap:15px;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}#stateLabel{font-size:11px;padding:3px 9px;background:var(--soft);color:var(--accent);border-radius:20px;margin:0;max-width:48%;text-align:center}progress{display:block;width:100%;height:3px;border:0;margin:18px 0 28px;accent-color:var(--accent);background:var(--soft)}progress::-webkit-progress-bar{background:var(--soft)}progress::-webkit-progress-value{background:var(--accent)}.sectionLabel{font:11px/1.5 Georgia,serif;letter-spacing:2px;color:var(--muted)}#question{font-family:"STSong","SimSun",serif;font-size:27px;font-weight:bold;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 18px}#hint{font-size:13px;color:var(--muted);margin-bottom:22px}.draftBox{margin:18px 0}.draftBox summary{justify-content:flex-start;gap:20px;font-size:13px;color:var(--muted);border:0;padding:0}.draftBox summary::after{font-size:15px}textarea{display:block;width:100%;min-height:140px;margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:15px;background:#fafaf5;resize:vertical;line-height:1.8}.revealRow{margin-top:24px}.key{font:11px/1.6 Georgia,serif;color:var(--muted);align-self:center}.answerArea{border-top:1px solid var(--line);padding:28px 38px;background:#f6f8f2}.answerHead{display:flex;justify-content:space-between;align-items:center;gap:15px;color:var(--accent);font-size:13px}.textButton{background:none;border:0;padding:3px 0;color:var(--muted);font-size:12px}#answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95;font-size:16px;margin-top:16px}#criteriaTitle{font-size:12px;color:var(--accent);margin:24px 0 8px}#criteria{padding-left:20px;margin:0;font-size:14px}#criteria li{margin:5px 0}.grading{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.grading p{font-size:12px;color:var(--muted);margin:0 0 10px}.gradeButtons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gradeButtons button{padding:10px 6px;font-size:14px}.gradeButtons button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}#gradeFeedback{color:var(--accent);font-size:12px;min-height:22px;margin:8px 0 0}.navigation{display:flex;justify-content:space-between;gap:12px;padding:18px 38px;border-top:1px solid var(--line);background:var(--paper)}.navigation button{min-width:105px}.footerNote{color:var(--muted);font-size:11px;margin:16px 0;text-align:center}#complete{padding:44px 38px}.completeMark{font:48px/1.4 Georgia,serif;color:var(--accent);margin-bottom:22px}#summary{font-size:17px;line-height:2;margin:18px 0}#complete .actions{margin-top:24px}
@media(max-width:860px){header{padding:18px 20px}main{grid-template-columns:minmax(0,1fr);margin:16px auto;padding:0 16px;gap:14px}aside{position:static;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 16px}#settings>summary{border:0;padding:12px 0}.settingsBody{border-top:1px solid var(--line);padding-bottom:18px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.searchField{grid-column:1/-1}.questionBody{padding:24px}.answerArea{padding:24px}.navigation{padding:14px 24px;position:sticky;bottom:0;box-shadow:0 -8px 18px #263b2a06}.card{overflow:visible}#question{font-size:24px}.key{display:none}#stats{max-width:54%;font-size:11px}.brand{gap:9px}h1{font-size:20px}.eyebrow{font-size:9px;letter-spacing:1px}#stateLabel{max-width:45%}.questionGrid{grid-template-columns:repeat(10,minmax(0,1fr))}#complete{padding:28px 24px}}
@media(max-width:420px){header{padding:14px 16px;gap:12px}.mark{display:none}.eyebrow{font-size:8px}main{padding:0 10px}.questionBody,.answerArea{padding:22px 20px}.meta{font-size:11px;gap:10px}#question{font-size:23px}.gradeButtons button{font-size:13px}.navigation{padding:12px 20px}.navigation button{padding:9px 12px;min-width:88px}.questionGrid{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">s</span><div><div class="eyebrow">STUDY FAST / PRACTICE</div><h1>__QUIZ_TITLE__</h1></div></div><div id="stats" aria-live="polite"></div></header>
<div id="notice" role="status"></div>
<main>
<aside><details id="settings"><summary>练习设置与题目导航</summary><div class="settingsBody">
<div class="filters"><div class="searchField"><label for="search">查找题目</label><input id="search" type="search" placeholder="输入题目关键词" autocomplete="off"></div>
<div><label for="category">分类</label><select id="category"><option value="">全部分类</option></select></div>
<div><label for="filter">练习范围</label><select id="filter"><option value="all">全部题目</option><option value="unseen">未评题目</option><option value="review">需复习 / 基本会</option><option value="passed">自评通过</option></select></div>
<div><label for="order">出题顺序</label><select id="order"><option value="sequential">顺序</option><option value="random">随机</option></select></div></div>
<div class="actions tools"><button id="restart">新一轮</button><button id="wrongOnly">错题重练</button></div>
<p class="legend">题号导航 · 绿：通过　橙：待复习</p><nav id="questionGrid" class="questionGrid" aria-label="本轮题号"></nav>
<details class="backup"><summary>进度备份与管理</summary><div class="actions"><button id="export">导出进度</button><button id="import">导入进度</button><button id="reset" class="danger">清空进度</button></div></details>
<input id="importFile" type="file" accept=".json,application/json" hidden>
</div></details></aside>
<div><section class="card">
<div id="session"><div class="questionBody"><div class="meta"><div id="position"></div><p id="stateLabel"></p></div><progress id="progress" max="1" value="0" aria-label="本轮自评进度"></progress>
<div class="sectionLabel">QUESTION / 独立作答</div><div id="question" tabindex="-1"></div><p id="hint">先想清楚，再看答案。可以口述，也可以展开草稿写下来。</p>
<details id="draftBox" class="draftBox"><summary>写下我的答案</summary><label for="draft" class="small">草稿仅在当前页面暂存，刷新后清空。</label><textarea id="draft" placeholder="写下你的思路、关键步骤或口述提纲……"></textarea></details>
<div class="actions revealRow"><button id="reveal" class="primary">查看参考答案</button><span class="key">空格揭晓 · ← → 切题</span></div></div>
<div id="solution" class="answerArea" hidden><div class="answerHead"><strong>参考答案</strong><button id="hideAnswer" class="textButton">收起，再想一遍 ↑</button></div><div id="answer"></div><p id="criteriaTitle">作答要点</p><ul id="criteria"></ul>
<div class="grading"><p>对照要点，给这一次作答一个评价</p><div class="gradeButtons"><button data-grade="review" aria-pressed="false">还需复习</button><button data-grade="partial" aria-pressed="false">基本会了</button><button data-grade="passed" aria-pressed="false">自评通过</button></div><p id="gradeFeedback" role="status"></p></div></div>
<div class="navigation"><button id="prev">← 上一题</button><button id="next">跳过此题 →</button></div></div>
<div id="complete" hidden><div class="completeMark" aria-hidden="true">✓</div><div class="sectionLabel">SESSION / 本轮回顾</div><h2>这一轮，练得怎么样？</h2><p id="summary"></p><p class="muted">统计只计本轮自评，跳过的题仍记为未评。</p><div class="actions"><button id="again" class="primary">再练一轮</button><button id="reviewAgain">复习薄弱题</button></div></div>
</section><p class="footerNote">离线单文件 · 自评不等于客观评分 · 进度自动保存在此浏览器</p></div>
</main>
<script id="quiz-data" type="application/json">__QUIZ_DATA__</script>
<script>
'use strict';
const bank=JSON.parse(document.getElementById('quiz-data').textContent);
const byId=new Map(bank.questions.map(q=>[q.id,q]));
const key='study-fast-quiz-v1:'+bank.bank_id;
const grades=['review','partial','passed'];
const $=id=>document.getElementById(id);
const fingerprint=q=>JSON.stringify([q.question,q.answer,q.criteria||[]]);
let records=Object.create(null),queue=[],cursor=0;
let round=Object.create(null),drafts=Object.create(null);
function notify(message){$('notice').textContent=message;}
function restore(data){
  if(!data||data.version!==1||data.bank_id!==bank.bank_id||!Array.isArray(data.records))throw Error('进度格式或题库身份不匹配。');
  const clean=Object.create(null);
  for(const r of data.records){
    const q=r&&byId.get(r.id);
    if(q&&grades.includes(r.grade)&&r.fingerprint===fingerprint(q))clean[q.id]={id:q.id,grade:r.grade,fingerprint:fingerprint(q)};
  }
  return clean;
}
function snapshot(){return {version:1,bank_id:bank.bank_id,records:Object.values(records)};}
function save(){try{localStorage.setItem(key,JSON.stringify(snapshot()));}catch(e){notify('浏览器无法保存进度；当前可继续练习，请导出进度备份。');}}
try{const saved=localStorage.getItem(key);if(saved)records=restore(JSON.parse(saved));}catch(e){notify('未能读取本地进度，已使用临时练习状态；可导入有效备份。');}
function matches(q){
  if($('category').value&&q.category!==$('category').value)return false;
  if(!q.question.toLocaleLowerCase().includes($('search').value.trim().toLocaleLowerCase()))return false;
  const grade=records[q.id]?.grade,filter=$('filter').value;
  return filter==='all'||(filter==='unseen'&&!grade)||(filter==='review'&&['review','partial'].includes(grade))||(filter==='passed'&&grade==='passed');
}
function start(){
  rememberDraft();round=Object.create(null);
  queue=bank.questions.filter(matches).map(q=>q.id);cursor=0;
  if($('order').value==='random')for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}
  render();
}
function stats(ids,source=records){
  const values=ids.map(id=>source[id]?.grade);
  return {passed:values.filter(x=>x==='passed').length,review:values.filter(x=>x==='review'||x==='partial').length,unseen:values.filter(x=>!x).length};
}
function render(){
  const total=stats(bank.questions.map(q=>q.id));
  $('stats').textContent=`共 ${bank.questions.length} 题 · 自评通过 ${total.passed} · 待复习 ${total.review} · 未评 ${total.unseen}`;
  const finished=cursor>=queue.length;$('session').hidden=finished;$('complete').hidden=!finished;
  drawGrid();
  if(finished){const s=stats(queue,round);$('summary').textContent=queue.length?`本轮 ${queue.length} 题：自评通过 ${s.passed}，待复习 ${s.review}，未评 ${s.unseen}。`:'没有符合条件的题目。试试清空关键词，或切换练习范围。';return;}
  const q=byId.get(queue[cursor]);
  $('position').textContent=`${q.category} · 第 ${cursor+1} / ${queue.length} 题`;
  $('progress').max=queue.length;$('progress').value=queue.filter(id=>round[id]).length;
  $('question').textContent=q.question;$('answer').textContent=q.answer;
  $('criteria').replaceChildren();
  for(const c of q.criteria||[]){const li=document.createElement('li');li.textContent=c;$('criteria').appendChild(li);}
  $('criteriaTitle').hidden=!(q.criteria||[]).length;
  $('draft').value=drafts[q.id]||'';$('solution').hidden=true;$('reveal').hidden=false;
  $('draftBox').open=Boolean(drafts[q.id]);$('gradeFeedback').textContent='';
  document.querySelectorAll('.gradeButtons [data-grade]').forEach(b=>b.setAttribute('aria-pressed','false'));
  const labels={review:'需复习',partial:'基本会',passed:'自评通过'};
  $('stateLabel').textContent=records[q.id]?'上次自评：'+labels[records[q.id].grade]+' · 本次可重新作答':'尚未自评';
  $('prev').disabled=cursor===0;updateNext();
}
function reveal(){$('solution').hidden=false;$('reveal').hidden=true;}
function hideAnswer(){$('solution').hidden=true;$('reveal').hidden=false;}
function rememberDraft(){if(cursor<queue.length)drafts[queue[cursor]]=$('draft').value;}
function updateNext(){const assessed=Boolean(round[queue[cursor]]),last=cursor===queue.length-1;$('next').textContent=last?(assessed?'查看本轮回顾 →':'跳过 / 结束本轮 →'):(assessed?'下一题 →':'跳过此题 →');$('next').className=assessed?'primary':'';}
function drawGrid(){
  $('questionGrid').replaceChildren();
  queue.forEach((id,i)=>{const b=document.createElement('button');b.textContent=String(i+1);b.dataset.grade=records[id]?.grade||'';b.setAttribute('aria-label',`第 ${i+1} 题：${byId.get(id).question}`);b.setAttribute('aria-current',String(i===cursor));b.onclick=()=>jump(i);$('questionGrid').appendChild(b);});
}
function jump(index){rememberDraft();cursor=index;render();$('question').scrollIntoView?.({block:'center',behavior:'instant'});}
function grade(value){
  if(!grades.includes(value)||cursor>=queue.length||$('solution').hidden)return;
  const q=byId.get(queue[cursor]);records[q.id]={id:q.id,grade:value,fingerprint:fingerprint(q)};save();
  round[q.id]={grade:value};
  $('stateLabel').textContent='本次已自评：'+({review:'需复习',partial:'基本会',passed:'自评通过'})[value];
  const s=stats(bank.questions.map(q=>q.id));$('stats').textContent=`共 ${bank.questions.length} 题 · 自评通过 ${s.passed} · 待复习 ${s.review} · 未评 ${s.unseen}`;
  $('progress').value=queue.filter(id=>round[id]).length;
  $('gradeFeedback').textContent='已记录本次自评，可以继续下一题。';
  document.querySelectorAll('.gradeButtons [data-grade]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.grade===value)));
  updateNext();drawGrid();
}
function next(){if(cursor<queue.length){rememberDraft();cursor++;render();$('question').scrollIntoView?.({block:'center',behavior:'instant'});}}
function previous(){if(cursor>0){rememberDraft();cursor--;render();}}
for(const cat of new Set(bank.questions.map(q=>q.category))){const option=document.createElement('option');option.value=cat;option.textContent=cat;$('category').appendChild(option);}
for(const id of ['category','filter','order'])$(id).addEventListener('change',start);
$('search').addEventListener('input',start);
$('settings').open=typeof matchMedia==='function'?matchMedia('(min-width:861px)').matches:true;
$('restart').onclick=start;$('again').onclick=start;$('reveal').onclick=reveal;$('prev').onclick=previous;$('next').onclick=next;
$('hideAnswer').onclick=hideAnswer;
$('wrongOnly').onclick=()=>{$('filter').value='review';start();};
$('reviewAgain').onclick=$('wrongOnly').onclick;
document.querySelectorAll('.gradeButtons [data-grade]').forEach(button=>button.onclick=()=>grade(button.dataset.grade));
$('reset').onclick=()=>{if(confirm('清空当前题库的全部自评进度？')){records=Object.create(null);save();start();}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=bank.bank_id+'-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('import').onclick=()=>$('importFile').click();
$('importFile').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{const imported=restore(JSON.parse(await file.text()));if(confirm('以此备份替换当前题库的进度？')){records=imported;save();start();notify('已导入匹配的自评记录；题目内容已变化的记录未恢复。');}}catch(e){notify('导入失败：'+e.message);}finally{event.target.value='';}};
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey||e.repeat||cursor>=queue.length)return;
  if(e.key===' '){e.preventDefault();if($('solution').hidden)reveal();else hideAnswer();}
  if(e.key==='ArrowRight'){e.preventDefault();next();}
  if(e.key==='ArrowLeft'){e.preventDefault();previous();}
  if(!$('solution').hidden&&['1','2','3'].includes(e.key)){e.preventDefault();grade(grades[Number(e.key)-1]);}
});
start();
</script>
</body></html>
